<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e141b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>چارت من</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <div><b id="sym">—</b><span id="dot"></span></div>
  <div class="pr" dir="ltr"><span id="price">—</span><small id="chg"></small></div>
  <button id="cfg" aria-label="تنظیمات">⚙</button>
</header>
<nav id="chips"></nav>
<nav id="tfs" dir="ltr"></nav>
<main id="chart" dir="ltr"><p id="msg"></p></main>
<footer>
  <button id="bDraw">خط افقی</button>
  <button id="bClr">پاک‌کردن خط‌ها</button>
  <button id="bEma">EMA</button>
  <button id="bAdd">+ نماد</button>
  <button id="bDel">حذف نماد</button>
</footer>
<dialog id="dAdd"><h3>افزودن نماد</h3>
  <label>منبع<select id="aSrc"><option value="binance">کریپتو (Binance)</option><option value="td">فارکس / طلا / سهام (Twelve Data)</option></select></label>
  <label>نماد<input id="aSym" dir="ltr" placeholder="BTCUSDT  یا  XAU/USD" autocapitalize="characters"></label>
  <div class="row"><button id="aOk" class="pri">افزودن</button><button data-close>بستن</button></div>
</dialog>
<dialog id="dCfg"><h3>تنظیمات</h3>
  <label>کلید Twelve Data<input id="kKey" dir="ltr" placeholder="API key"></label>
  <label>داده دستی (CSV: time,open,high,low,close,volume)<input id="kCsv" type="file" accept=".csv,.txt"></label>
  <div class="row"><button id="kOk" class="pri">ذخیره</button><button data-close>بستن</button></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body></html>
